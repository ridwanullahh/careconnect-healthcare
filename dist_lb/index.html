<script>
/* Lightbase Edge 0.1.16 shell (BismiLLAH) — zero CF Workers SSR bridge.
   Page routes are SSR'd at request time by Lightbase edge; this shell is
   served unmetered from the Pages CDN and swaps the SSR HTML in.
   Wire protocol v3.1: NO custom headers (some PaaS gateways eat CORS
   preflights) — the cookie jar rides the __lbjar query param. */
window.__LB__ = null;

function lbErrDoc(status, kind){
  kind = kind || (status === 404 ? 'notfound' : (status === 429 ? 'warming' : 'hiccup'));
  var K = {
    notfound: { pill: '404 — not found', title: 'This page could not be rendered',
      desc: 'The edge could not find a renderer for this route. It may appear after the next publish, or the link may be outdated.',
      retry: false, home: true },
    warming: { pill: 'Edge warming up', title: 'Preparing a fresh render for you',
      desc: 'This app is loading onto the Lightbase edge runtime. Your place is held — the page opens automatically.',
      retry: true, home: false },
    hiccup: { pill: 'Edge hiccup', title: 'The edge hit a temporary snag',
      desc: 'The render did not complete this time. Retrying usually resolves it instantly.',
      retry: true, home: true },
    network: { pill: 'Reconnecting', title: 'Reconnecting to the edge',
      desc: 'The connection to the render plane dropped. Retrying automatically…',
      retry: true, home: false }
  }[kind] || { pill: 'Edge hiccup', title: 'The edge hit a temporary snag', desc: 'Retrying usually resolves it instantly.', retry: true, home: true };
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var css = ''
    + '*{box-sizing:border-box}'
    + '.lb-err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;margin:0;'
    + 'font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8eefc;'
    + 'background:radial-gradient(1100px 560px at 50% -8%,#182647 0%,#0b1020 62%) no-repeat #0b1020}'
    + '@media (prefers-color-scheme:light){.lb-err{color:#0f172a;'
    + 'background:radial-gradient(1100px 560px at 50% -8%,#ffffff 0%,#eef2f9 62%) no-repeat #eef2f9}}'
    + '.lb-err__card{max-width:430px;width:100%;border-radius:18px;padding:34px 30px 26px;text-align:center;'
    + 'background:rgba(255,255,255,.045);border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 60px -24px rgba(2,6,23,.55)}'
    + '@media (prefers-color-scheme:light){.lb-err__card{background:#fff;border-color:#e2e8f0;box-shadow:0 24px 60px -30px rgba(15,23,42,.25)}}'
    + '.lb-err__spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(148,163,184,.28);'
    + 'border-top-color:#10b981;animation:lberr 0.8s linear infinite;margin:0 auto 16px}'
    + '@keyframes lberr{to{transform:rotate(360deg)}}'
    + '.lb-err__pill{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;'
    + 'color:#10b981;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.28);border-radius:999px;padding:5px 12px;margin-bottom:18px}'
    + '.lb-err__t{font-size:1.28rem;font-weight:650;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em}'
    + '.lb-err__d{font-size:.9rem;line-height:1.6;opacity:.72;margin:0 0 22px}'
    + '.lb-err__row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 6px}'
    + '.lb-err__btn{display:inline-block;appearance:none;border:0;border-radius:11px;padding:10px 20px;'
    + 'font-size:.86rem;font-weight:600;cursor:pointer;text-decoration:none;'
    + 'background:linear-gradient(135deg,#10b981,#0ea5e9);color:#04211a;transition:transform .12s ease,box-shadow .12s ease}'
    + '.lb-err__btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(14,165,233,.5)}'
    + '.lb-err__btn--ghost{background:transparent;color:inherit;border:1px solid rgba(148,163,184,.4)}'
    + '.lb-err__count{font-size:.8rem;opacity:.6;margin:14px 0 0}'
    + '@media (prefers-reduced-motion:reduce){.lb-err__spin{animation-duration:2.4s}}';
  var btns = K.home
    ? '<div class="lb-err__row"><a class="lb-err__btn" href="/">Back to home</a>'
      + '<button class="lb-err__btn lb-err__btn--ghost" onclick="location.reload()">Try again</button></div>'
    : '<div class="lb-err__row"><button class="lb-err__btn lb-err__btn--ghost" onclick="location.reload()">Try again</button></div>';
  var spin = K.retry ? '<div class="lb-err__spin" aria-hidden="true"></div>' : '';
  var count = K.retry ? '<p class="lb-err__count" id="__lbrc">Retrying…</p>' : '';
  var script = K.retry
    ? '<script>(function(){var s=' + Math.max(2, Math.min(8, Math.round((status === 429 ? 4 : 3)))) + ';'
      + 'var e=document.getElementById("__lbrc");'
      + 'function t(){if(!e)return;if(s<=0){location.reload();return}e.textContent="Retrying in "+s+"s…";s--;setTimeout(t,1000)}t();})();<\/script>'
    : '';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<meta name="robots" content="noindex">'
    + '<title>' + esc(K.title) + '</title><style>' + css + '</style></head>'
    + '<body class="lb-err"><div class="lb-err__card" role="alert">'
    + spin
    + '<span class="lb-err__pill">' + esc(K.pill) + '</span>'
    + '<h1 class="lb-err__t">' + esc(K.title) + '</h1>'
    + '<p class="lb-err__d">' + esc(K.desc) + '</p>'
    + btns + count
    + '</div>' + script + '</body></html>';
}

function jarGet(){try{return JSON.parse(localStorage.getItem('__lb_jar__')||'{}')}catch(e){return{}}}
function jarSave(j){try{localStorage.setItem('__lb_jar__',JSON.stringify(j))}catch(e){}}
function jarHeader(){var j=jarGet();return Object.keys(j).map(function(k){return k+'='+j[k]}).join('; ')}
function absorbCookies(hdrText){
  try{if(!hdrText)return;JSON.parse(hdrText).forEach(function(sc){
    var kv=sc.split(';')[0];var i=kv.indexOf('=');if(i<=0)return;
    var k=kv.slice(0,i).trim(),v=kv.slice(i+1).trim();var j=jarGet();
    if(/Expires=Thu, 01 Jan 1970|Max-Age=0/i.test(sc)){delete j[k]}else{j[k]=v}
    jarSave(j);
  });}catch(e){}
}
function gatewayUrl(base, path, search, jar){
  var q = [];
  if (search && search.length > 1) q.push(search.slice(1));
  if (jar) q.push('__lbjar=' + encodeURIComponent(jar));
  return base + path + (q.length ? '?' + q.join('&') : '');
}
function SSR(){this.__lb=true}
window.__LB_SSR_BOOT__ = function(){ return new SSR(); };
// BismiLLAH (0.1.1 parse-guard): verify /sw.js really IS the Lightbase bridge
// before registering it. A stale PWA service worker from an older deployment
// (or a cache-first ghost) must be unregistered + its caches cleared, then
// one reload brings the bridge in — no white pages, no stale shells.
function swGuard(){
  if(!('serviceWorker' in navigator))return;
  fetch('/sw.js',{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(txt){
    if(txt.indexOf('__lb')!==-1){navigator.serviceWorker.register('/sw.js').catch(function(){});return;}
    navigator.serviceWorker.getRegistrations().then(function(rs){
      Promise.all(rs.map(function(x){return x.unregister()})).then(function(){
        try{if(sessionStorage.getItem('__lb_swfix__'))return;sessionStorage.setItem('__lb_swfix__','1')}catch(e){}
        var done=function(){location.reload()};
        if(window.caches&&caches.keys){caches.keys().then(function(ks){Promise.all(ks.map(function(k){return caches.delete(k)})).then(done,done)},done)}
        else{done()}
      });
    }).catch(function(){});
  }).catch(function(){});
}
// BismiLLAH (0.1.2 FOUC guard): nothing ever paints raw. While the boot class
// sits on <html>, every body child except the loader stays invisible — the
// first paint the user sees is either the styled SSR document or the loader.
document.documentElement.className += ' lb-boot';
function lbSwap(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  if(doc.title)document.title=doc.title;
  var head=document.head;
  head.querySelectorAll('script[data-lb-boot],style[data-lb-boot]').forEach(function(n){n.remove()});
  var cssLoads=[];
  doc.head.querySelectorAll('script,style,link,meta,title').forEach(function(n){
    if(n.tagName==='TITLE'){document.title=n.textContent||document.title;return;}
    if(n.tagName==='SCRIPT'&&!n.src&&!n.textContent)return;
    var c=n.cloneNode(true);
    if(c.tagName==='SCRIPT'){var s=document.createElement('script');
      for(var i=0;i<c.attributes.length;i++){var a=c.attributes[i];s.setAttribute(a.name,a.value);}
      if(c.textContent)s.textContent=c.textContent; c=s;}
    head.appendChild(c);
    // BismiLLAH (0.1.2): track external stylesheets — the curtain lifts only
    // after they settle (bounded 2.5s each), so the user NEVER sees the raw-
    // HTML-then-CSS flash. A hung request can never wedge the page.
    if(c.tagName==='LINK'&&/stylesheet/i.test(c.rel||''))cssLoads.push(new Promise(function(res){
      var done=function(){res()};
      c.addEventListener('load',done);c.addEventListener('error',done);setTimeout(done,2500);
    }));
  });
  var body=doc.body;
  // BismiLLAH (0.1.16): the delayed spinner is a boot-only artifact — stop its
  // timer the moment real content arrives so it can never flash mid-page.
  try{clearTimeout(window.__lbBootTimer)}catch(e){}
  document.getElementById('__lb_boot__')&&document.getElementById('__lb_boot__').remove();
  document.body.innerHTML=body.innerHTML;
  document.body.querySelectorAll('script').forEach(function(old){
    var s=document.createElement('script');
    for(var i=0;i<old.attributes.length;i++){var a=old.attributes[i];s.setAttribute(a.name,a.value);}
    if(!old.src&&old.textContent)s.textContent=old.textContent;
    if(old.type) s.type=old.type;
    old.replaceWith(s);
  });
  return Promise.all(cssLoads).then(function(){
    document.documentElement.className=document.documentElement.className.replace(/(^|\s)lb-boot(\s|$)/g,' ');
  });
}
function lbFail(status,kind){
  document.open();document.write(lbErrDoc(status,kind));document.close();
}
async function boot(){
  // BismiLLAH (0.1.16 — warm plane): NO boot chrome on the happy path. Only
  // if the swap is still pending after 2.5s (a genuinely slow/cold origin —
  // rare with the resident fleet) does a small, quiet spinner fade in.
  window.__lbBootTimer=setTimeout(function(){
    var b=document.getElementById('__lb_boot__');
    if(b){b.hidden=false;b.innerHTML='<div class="l" role="status" aria-label="Loading"></div>'}
  },2500);
  var cfg=window.__LB__;
  // BismiLLAH (0.1.18 — origin-coherent config): the served HTML carries NO
  // gateway URL. The config rides a same-origin static descriptor instead.
  if(!cfg){
    try{ var cr=await fetch('/lb-config.json',{cache:'no-store'}); if(cr.ok) cfg=await cr.json(); }catch(e){}
  }
  // Zero-baking fallback: resolve config by hostname at runtime.
  if(!cfg||cfg.resolveByHost){
    try{
      var rr=await fetch('https://lightbase-10133292663.development.catalystappsail.com/api/v1/projects/careconnect/edge/resolve?host='+encodeURIComponent(location.host));
      var d=await rr.json();
      if(d&&d.ok){cfg={lbUrl:'https://lightbase-10133292663.development.catalystappsail.com',projectId:d.projectId,appId:d.appId,
        gateway:'https://lightbase-10133292663.development.catalystappsail.com'+d.gateway,assetPrefixes:d.assetPrefixes||cfg.assetPrefixes||[]};}
    }catch(e){}
  }
  if(!cfg){try{clearTimeout(window.__lbBootTimer)}catch(e){}console.warn('[lb-edge] no bridge config');return;}
  window.__LB__=cfg;
  // BismiLLAH (0.1.1): register/verify the service worker EARLY, in parallel
  // with the first SSR fetch — the very next navigation is already SW-SSR'd.
  swGuard();
  // BismiLLAH (0.1.1): one resilience retry — a waking instance or a cold
  // origin must not paint an error on the very first hit.
  var r=null;
  try{r=await fetch(gatewayUrl(cfg.gateway,location.pathname,location.search,jarHeader()),{credentials:'omit'})}catch(e){}
  // BismiLLAH (0.1.1 async cold loads): bounded backoff — a cold app answers
  // 429 load_in_progress / 5xx while its 30s+ load finishes in the background.
  for(var attempt=0;(!r||r.status===429||r.status>=500)&&attempt<8;attempt++){
    var ra=0;try{ra=parseInt(r&&r.headers.get('retry-after')||'0',10)||0}catch(_e){}
    var waitMs=attempt===0?900:Math.min(Math.max(ra,2),6)*1000;
    await new Promise(function(res){setTimeout(res,waitMs)});
    try{r=await fetch(gatewayUrl(cfg.gateway,location.pathname,location.search,jarHeader()),{credentials:'omit'})}catch(e){}
  }
  if(!r){ try{clearTimeout(window.__lbBootTimer)}catch(e){} lbFail(503,'network'); return; }
  try{absorbCookies(r.headers.get('x-lb-set-cookie'))}catch(e){}
  if(!r.ok){
    try{clearTimeout(window.__lbBootTimer)}catch(e){}
    // BismiLLAH (0.1.2 — hybrid-honest fallback, the Researchful fix): apps
    // prerender marketing/legal routes to the Pages CDN; the SSR plane
    // honestly 404s them. Before ANY error, ask OUR origin for the exact
    // path — real static files win over _redirects, so a shell-shaped 200
    // means the route truly does not exist anywhere.
    if(r.status===404){
      try{
        var s=await fetch(location.pathname+location.search,{cache:'no-store'});
        if(s.ok){
          var stxt=await s.text();
          if(stxt.indexOf('__LB__')===-1&&stxt.indexOf('<html')!==-1){await lbSwap(stxt);return;}
        }
      }catch(e){}
    }
    lbFail(r.status, r.status===404?'notfound':(r.status===429?'warming':'hiccup'));
    return;
  }
  var html=await r.text();
  try{ await lbSwap(html); }catch(e){ try{clearTimeout(window.__lbBootTimer)}catch(_e){} lbFail(503,'hiccup'); return; }
  // Service worker takes over subsequent navigations (true SSR fidelity).
  if('serviceWorker' in navigator){
    try{
      navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:'jar',jar:jarGet()});
    }catch(e){}
  }
}
boot();
</script>
